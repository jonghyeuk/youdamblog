<svg width="600" height="315" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="315" fill="url(#logoGrad)"/>

  <!-- Logo Circle -->
  <circle cx="300" cy="120" r="50" fill="white" opacity="0.2"/>
  <circle cx="300" cy="120" r="35" fill="white"/>

  <!-- Y letter in circle -->
  <text x="300" y="145" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#7c3aed" text-anchor="middle">
    Y
  </text>

  <!-- Brand name -->
  <text x="300" y="220" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle">
    Yudam's Life
  </text>

  <!-- Tagline -->
  <text x="300" y="260" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Health, Fitness &amp; Lifestyle
  </text>
</svg>
